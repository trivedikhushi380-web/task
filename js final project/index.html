<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store</title>
    <link rel="stylesheet" href="styale.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            🛍️ Product Store
        </div>

        <div class="header-right">

            <input
                type="text"
                id="searchInput"
                placeholder="Search product..."
            >

            <label for="sortPrice">sortPrice</label>
            <select id="sortPrice">

                <option value="default">
                    Sort By Price
                </option>

                <option value="low">
                    Low to High
                </option>

                <option value="high">
                    High to Low
                </option>

            </select>

            <button class="cart-btn" onclick="showCart()">

                🛒 Cart

                <span id="cartCount">0</span>

            </button>

        </div>

    </header>

    <main class="container">

        <h1 class="page-title">
            All Products
        </h1>

        <div class="categories">

            <button onclick="filterProducts('All')">
                All
            </button>

            <button onclick="filterProducts('Mobile')">
                📱 Mobile
            </button>

            <button onclick="filterProducts('Laptop')">
                💻 Laptop
            </button>

            <button onclick="filterProducts('Headphone')">
                🎧 Headphone
            </button>

            <button onclick="filterProducts('Shoes')">
                👟 Shoes
            </button>

            <button onclick="filterProducts('Watch')">
                ⌚ Watch
            </button>

        </div>

        <div id="productContainer" class="product-container"></div>

    </main>

    <div
        id="cartModal"
        class="cart-modal">

        <div class="cart-box">
            <button class="close-btn" onclick="closeCart()">✖</button>

            <h2>
                🛒 My Cart
            </h2>
            <div id="cartItems"></div>


            <div class="cart-total">

                <h3>
                    Total:
                    ₹<span id="cartTotal">0</span>
                </h3>

            </div>
            <button
                class="checkout-btn"
                onclick="checkout()">

                Checkout

            </button>

        </div>
    </div>
    <script src="console.js"></script>

</body>
</html>
