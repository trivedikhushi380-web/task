<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="main-title">Budget Tracker System</h1>

    <div class="main-box">
        <div class="left-side">
            <div class="input-card">

                <h2>Add Budget</h2>

                <label>Budget:</label>

                <input type="number" id="budgetInput">

                <button class="blue-btn" onclick="addBudget()">
                    Add Budget
                </button>

            </div>


            <div class="input-card expense-card">

                <h2>Add Expense</h2>

                <label>Expense Title:</label>

                <input type="text" id="expenseTitle">


                <label>Amount:</label>

                <input type="number" id="expenseAmount">


                <button class="blue-btn" onclick="addExpense()">
                    Add Expense
                </button>

            </div>

            <button class="reset-btn" onclick="resetAll()">
                Reset All
            </button>

        </div>

        <div class="right-side">
            <div class="summary">

                <div class="summary-box">
                    Total Budget:
                    <span id="totalBudget">
                        10000.00
                    </span>
                </div>


                <div class="summary-box">
                    Total Expenses:
                    <span id="totalExpenses">
                        7500.00
                    </span>
                </div>


                <div class="summary-box">
                    Budget Left:
                    <span id="budgetLeft">
                        2500.00
                    </span>
                </div>

            </div>
            <div class="history">

                <h2>Expense History:</h2>

                <table>

                    <thead>
                        <tr>
                            <th>Expense Name</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="expenseTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="console.js"></script>

</body>

</html>
